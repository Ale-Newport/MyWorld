# Categories for GitHub's generated release notes.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug]
    - title: Performance
      labels: [performance]
    - title: Accessibility
      labels: [accessibility]
    - title: Security
      labels: [security]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
